[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebro-cli"
version = "0.1.0"
description = "cerebro-cli - single CLI for the cerebro ecosystem (memory, docs, backup/restore, cross-service tokens)"
requires-python = ">=3.11"
dependencies = [
    "cerebro-clients",
    # `cerebro memory import-markdown` reusa el parser puro de cerebro-memory
    # (cerebro_memory.markdown_importer) - no su mcp_server.py/cli.py, que se
    # eliminan (ecosistema-cerebro.md SS4/SS14: cerebro-memory queda como servicio
    # API puro).
    "cerebro-memory",
    # Salida de terminal. Los comandos la usan via cerebro_cli.console; el color
    # solo aparece en un TTY. PyInstaller la empaqueta solo cuando algún módulo
    # importado desde main.py importa esa consola.
    "rich>=13.7",
    # Menús y prompts solo en un TTY. Rich sigue siendo la salida; questionary
    # no pinta resultados. PyInstaller lo ve porque main.py lo importa.
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cerebro = "cerebro_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
